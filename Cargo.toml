[workspace]
members = ["fern-meta", "fern-download", "fern-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0.98"
fern-download = { path = "fern-download" }
fern-meta = { path = "fern-meta" }
md-5 = "0.10.6"
pearl-core = { git = "https://github.com/HuanCheng65/pearl.git", rev = "f5c655c9f8481655e3a0b76aa28df34a693f1ed0" }
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.11.1"
sha1 = "0.10.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.46.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
