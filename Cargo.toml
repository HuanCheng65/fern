[workspace]
members = ["fern-meta", "fern-download", "fern-core"]
resolver = "2"

[workspace.package]
# **这不是 Fern 的版本号。** 产品版本只有一个来源：`fern-ui/src-tauri/Cargo.toml`
# （见 docs/fern-update-design.md 的版本号一节）。这几个库不发布到 crates.io，
# 也没有外部使用者，它们的版本号没有任何人会读——留一个会跟着产品一起变的数字，
# 只会让人以为「fern-core 0.3.1」和「Fern 0.3.1」是一回事，然后在发版时漏改。
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
flate2 = "1.0"
fern-download = { path = "fern-download" }
fern-meta = { path = "fern-meta" }
getrandom = "0.3"
libc = "0.2"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
md-5 = "0.10.6"
pearl-core = { git = "https://github.com/HuanCheng65/pearl.git", rev = "15b47647b02f55bcd07365bf90a73256ea825e3a" }
# `socks` 不是可选的：Clash、v2ray 这类工具在本机开的就是 socks5，而
# `Proxy::all` 在没有这个 feature 时照样接受 `socks5://` 地址，只在真的发请求时
# 才失败——设置界面会说地址没问题，下载却一个也下不动。
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls", "socks"] }
regex = "1.11.1"
# 版本号要能被反序列化（清单里是字符串），也要能按 SemVer 的规则比大小——
# 预发布版小于同号正式版这一条，是通道之间不需要额外逻辑的全部原因。
semver = { version = "1.0.28", features = ["serde"] }
sha1 = "0.10.6"
sha2 = "0.10.9"
tar = "0.4"
# 规则表与 Forge 的 mods.toml。后者有 `[[dependencies.x]]` 这样的嵌套表，
# 手写行解析扛不住。
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
# 删存档走系统回收站。三个平台各有一套（XDG trash、Finder、资源管理器），
# 而「删错了还能捞回来」这件事只有系统那一份做得到——自己搬到某个目录里，
# 用户在文件管理器里是找不到还原按钮的。
trash = "5.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.46.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
# 只解 natives jar：Mojang 发的全是标准 deflate。默认特性会拖进 bzip2、
# lzma、zstd 三个 C 依赖，既没人用，又让交叉编译要一整套 C 工具链。
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
