name: Check and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fern-ui/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      # fern-core 通过 keyring 依赖 libdbus-1（令牌存系统钥匙串）。runner 镜像
      # 里有没有它不保证，缺了的话 cargo test 会在 libdbus-sys 的构建脚本上挂。
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: fern-ui

      - name: Check frontend
        run: pnpm check
        working-directory: fern-ui

      - name: Build frontend
        run: pnpm build
        working-directory: fern-ui

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      # clippy 这次拦下过好几处真问题（可折叠的 if、手写的 range contains）。
      # 只跑 fmt 不跑 clippy，等于把一半的静态检查关掉了。
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # 平台专属依赖段写错位置时，跨平台的依赖会被一起圈进去：本平台照常编译，
      # 另一个平台上「unresolved import」刷屏。依赖解析不用编译，几秒就能拦住，
      # 不必等十几分钟的打包任务。
      - name: Check dependency resolution across platforms
        run: python3 .github/check-platform-deps.py

  package:
    name: Package ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            rust_targets: x86_64-unknown-linux-gnu
            build_args: --target x86_64-unknown-linux-gnu --bundles deb,appimage
            artifact_name: Fern-Linux-x64
            artifact_paths: |
              fern-ui/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              fern-ui/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          - name: Windows x64
            runner: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            build_args: --target x86_64-pc-windows-msvc --no-bundle
            artifact_name: Fern-Windows-x64-portable
            artifact_paths: fern-ui/src-tauri/target/x86_64-pc-windows-msvc/release/fern-ui.exe
          - name: macOS universal
            runner: macos-14
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            build_args: --target universal-apple-darwin --bundles app,dmg
            artifact_name: Fern-macOS-universal
            artifact_paths: |
              fern-ui/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
              fern-ui/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fern-ui/pnpm-lock.yaml

      # Tauri 在 Linux 上要 WebKitGTK 一整套；libdbus-1-dev 是 keyring 要的。
      # 其余平台的钥匙串走系统原生 API，不需要额外的包。
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            libdbus-1-dev build-essential file pkg-config

      - name: Install Rust targets
        run: rustup target add ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fern-ui/src-tauri -> target
          shared-key: ${{ matrix.artifact_name }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: fern-ui

      - name: Build desktop package
        run: pnpm tauri build ${{ matrix.build_args }}
        working-directory: fern-ui

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          compression-level: 6
