# 官网。
#
# 站变了就构建一遍，直接推到 Cloudflare Workers。和另外两条的分工：`package.yml`
# 管「每次提交都能编过」，`release.yml` 管「桌面端发得出去」，这一条只管官网。
#
# 构建放在 Actions 里，不交给 Cloudflare 那边的 Git 集成——它的构建环境要自己再钉
# 一遍 Node 和 pnpm 版本，而这个仓库是 pnpm 工作区，官网直接引 `fern-kit` 的源码。
# 同一份工具链在两个地方各配一次，迟早会分叉。所以这里只把构建好的目录传上去。
#
# Worker 叫什么、资源目录在哪，全在 `fern-site/wrangler.jsonc` 里，跟着代码走。
#
# **需要的仓库配置**（缺任何一项都会在部署那一步失败，不会静悄悄发错）：
#
#   secrets.CLOUDFLARE_API_TOKEN   见下
#   secrets.CLOUDFLARE_ACCOUNT_ID  账号 id，和 release.yml 里的 R2_ACCOUNT_ID 是同一个值
#
# 令牌在 My Profile → API Tokens 建（**用户令牌**，不是 Manage Account 下那种账号
# 令牌：wrangler 会去问 /memberships，而账号令牌根本没有这个作用域，报的是一句
# 看不出所以然的 `Unable to authenticate request [code: 10001]`）。三项权限：
#
#   Account → Workers Scripts → Edit    部署脚本、上传静态资源
#   Account → Account Settings → Read   wrangler 启动时要读账号信息
#   User → Memberships → Read           同上，它认这个身份
#
# 别用 "Edit Cloudflare Workers" 那个模板：它顺带给了 KV、R2、Durable Objects 和
# 路由的写权限，而这个 Worker 一个都不用——R2 里躺着的是发布出去的安装包。
#
# 以后要让 wrangler 自己接自定义域（wrangler.jsonc 里写 routes），再加一项
# Zone → Workers Routes → Edit，限定在那一个域名上。在面板里手动接则不用。

name: Deploy the site

on:
  push:
    branches: [main]
    paths:
      # fern-kit 也在里面。官网那些「真实界面」不是截图，是真的把 kit 的组件渲染
      # 出来——kit 改了，站上看到的就变了。漏掉它的症状是官网静悄悄地停在旧版本，
      # 而没有任何一次构建失败提醒你。
      - 'fern-site/**'
      - 'fern-kit/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# 只有最新的那一次有意义：连着推三个提交，中间那两版没人需要看到。
concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      # 锁文件在工作区根，装依赖也必须在根跑：官网 import fern-kit，那条链接是
      # pnpm 在工作区范围内建的（和 package.yml 里是同一个理由）。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # adapter-static 会把每一页都预渲染出来，站内链接指向不存在的路由时这一步
      # 直接失败——这就是官网这条流水线的检查环节，不另设一个。
      - name: Build the site
        run: pnpm build
        working-directory: fern-site

      # wrangler 的版本不钉。Node 和 pnpm 钉住是因为它们决定构建出什么；wrangler
      # 只是个把目录传上去的客户端，产物一个字节都不经它的手，而它对面那个 API 是
      # 一直在走的。钉住反而是让一个只会越来越旧的客户端去够一个新接口。
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 在这个目录里跑，wrangler 才读得到 wrangler.jsonc；命令本身没有参数，
          # 该传什么全写在那个文件里。
          workingDirectory: fern-site
          command: deploy
