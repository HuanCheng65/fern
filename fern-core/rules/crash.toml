# 崩溃原因识别表。
#
# 一条规则 = 一个必须命中的正则 + 若干只做收窄的守卫。取值靠命名捕获组，
# 捕获组的值作为参数交给界面，动作里也可以用 `{name}` 引用。引擎见 crash/rules.rs。
#
# **这里没有文案。** 一条规则给出的是 id 和捕获到的参数，措辞在
# fern-ui/src/lib/i18n/ 里按 `crash.<id>` 查，翻译也在那边。
#
# 规矩三条：
#   1. 每条规则必须在 rules/fixtures/<id>.txt 有一份对应的真实文本，测试会查。
#   2. 正则尽量锚在**不会变的东西**上——异常类名、加载器自己的错误结构。
#      锚在散文上的规则会在下一个版本悄悄失效。
#   3. 拿不准就别写。一句听着像那么回事、其实不对的诊断，比「不认识」更浪费
#      用户的时间。
#
# level：exact 认得出具体是哪两个东西撞了 / named 说得出主语 / generic 只认类别。

# ── 内存 ───────────────────────────────────────────────────────────────────

[[rule]]
id = "out-of-memory"
level = "named"
match = '''java\.lang\.OutOfMemoryError: (?<kind>Java heap space|GC overhead limit exceeded|Metaspace|Direct buffer memory|unable to create native thread)'''

# ── Java ───────────────────────────────────────────────────────────────────

# class 文件版本到 Java 大版本是一张固定的表（55=11、61=17、65=21），但插值
# 只做替换不做算术，所以这里只说事实，具体该换哪个版本由启动前预检查回答——
# 它知道这个版本要求什么，比从崩溃里反推可靠。
[[rule]]
id = "java-too-old"
level = "named"
match = '''java\.lang\.UnsupportedClassVersionError: (?<class>\S+) has been compiled by a more recent version of the Java Runtime \(class file version (?<needed>\d+)\.0\), this version of the Java Runtime only recognizes class file versions up to (?<current>\d+)\.0'''

# 用户自己填的 JVM 参数写错时，JVM 连起都起不来，而原因就在我们的设置里。
[[rule]]
id = "unrecognized-jvm-option"
level = "exact"
scope = "console"
match = '''Unrecognized (?:option|VM option): '?(?<option>[^'\s]+)'?'''

# ── 模组依赖：Fabric / Quilt ───────────────────────────────────────────────

[[rule]]
id = "fabric-missing-dependency"
level = "named"
loader = ["fabric", "quilt"]
match = '''requires (?<requirement>[^,]+?) of (?<need>[A-Za-z0-9_.-]+), which is missing'''
action = { kind = "install-mod", query = "{need}" }

[[rule]]
id = "fabric-incompatible-mods"
level = "generic"
loader = ["fabric", "quilt"]
match = '''Incompatible mods found!'''

# ── 模组依赖：Forge / NeoForge ─────────────────────────────────────────────

[[rule]]
id = "forge-missing-dependency"
level = "named"
loader = ["forge", "neoforge"]
match = '''Mod ID: '(?<need>[^']+)', Requested by: '(?<by>[^']+)', Expected range: '(?<range>[^']*)', Actual version: '\[MISSING\]''''
action = { kind = "install-mod", query = "{need}" }

[[rule]]
id = "forge-mandatory-dependencies"
level = "generic"
loader = ["forge", "neoforge"]
match = '''Missing or unsupported mandatory dependencies'''

# Forge 一系把加载失败写成一个 `-- MOD <modid> --` 段，里面的 Failure message
# 是给人看的一句话。语料里这三条加起来占了「模组加载失败」的绝大多数。

# 前置没装。「Currently, X is not installed」是判据，缺了它就分不清是没装还是
# 版本不对，而这两件事的处理方式不一样。
[[rule]]
id = "forge-dependency-missing"
level = "named"
loader = ["forge", "neoforge"]
match = '''Failure message: Mod (?<mod>[\w-]+) requires (?<dependency>[\w-]+) (?<requirement>[^\n]+)\s*\n\s*Currently, [\w-]+ is not installed'''
action = { kind = "install-mod", query = "{dependency}" }

# 前置装了，但版本不对。这一条不给「去安装」——用户已经有它了，要做的是换版本。
[[rule]]
id = "forge-dependency-version"
level = "named"
loader = ["forge", "neoforge"]
match = '''Failure message: Mod (?<mod>[\w-]+) requires (?<dependency>[\w-]+) (?<requirement>[^\n]+)\s*\n\s*Currently, [\w-]+ is (?<current>[^\n]+)'''

# 某个模组自己在加载时抛了异常。具体原因在它那一段的栈里，但说出是谁已经解决
# 了大半——用户接下来要做的就是去掉它或者换个版本。
[[rule]]
id = "forge-mod-failed-to-load"
level = "named"
loader = ["forge", "neoforge"]
match = '''Failure message: (?<mod>[^\n(]+?) \((?<modid>[\w-]+)\) has failed to load correctly'''

[[rule]]
id = "forge-mods-incompatible"
level = "generic"
loader = ["forge", "neoforge"]
match = '''Some of your mods are incompatible with the game or each other!'''

# ── 重复装了同一个模组 ────────────────────────────────────────────────────

[[rule]]
id = "duplicate-mod"
level = "named"
match = '''Found a duplicate mod (?<name>[A-Za-z0-9_.-]+) at (?<path>\S+)'''
action = { kind = "remove-mod", file = "{path}" }

[[rule]]
id = "forge-duplicate-mods"
level = "generic"
loader = ["forge", "neoforge"]
match = '''Found duplicate mods:'''

# ── Mixin ─────────────────────────────────────────────────────────────────

# mixin 配置名的前缀就是 modid，所以这一条说得出是谁——比栈还准。
[[rule]]
id = "mixin-failure-named"
level = "exact"
match = '''org\.spongepowered\.asm\.mixin\.(?:injection\.throwables\.InvalidInjectionException|transformer\.throwables\.MixinApplyError|throwables\.MixinApplyError)[\s\S]{0,400}?(?<config>[A-Za-z0-9_.-]+)\.mixins\.json'''

[[rule]]
id = "mixin-failure"
level = "generic"
match = '''org\.spongepowered\.asm\.mixin\.(?:injection\.throwables\.InvalidInjectionException|transformer\.throwables\.MixinApplyError|throwables\.MixinApplyError)'''

# ── 图形 ───────────────────────────────────────────────────────────────────

# hs_err 里那一行是原生崩溃唯一的线索：Java 侧什么都没有。
[[rule]]
id = "graphics-driver-crash"
level = "exact"
scope = "hs-err"
match = '''\[(?<library>(?:nvoglv64|nvoglv32|ig9icd64|ig11icd64|igxelpicd64|atio6axx|atioglxx|amdvlk64)\.dll)'''

[[rule]]
id = "graphics-unavailable"
level = "generic"
match = '''(?:Pixel format not accelerated|Failed to initialize GLFW|Couldn't set pixel format|WGL_ARB_create_context|No OpenGL context found|OpenGL 1\.[0-9] is not supported)'''

# ── 文件 ───────────────────────────────────────────────────────────────────

[[rule]]
id = "corrupt-archive"
level = "generic"
match = '''(?:java\.util\.zip\.ZipException|Invalid CEN header|java\.util\.zip\.ZipError|error in opening zip file)'''

[[rule]]
id = "broken-config"
level = "generic"
loader = ["forge", "neoforge"]
match = '''com\.electronwill\.nightconfig\.core\.io\.ParsingException'''

# ── 网络 ───────────────────────────────────────────────────────────────────

[[rule]]
id = "port-in-use"
level = "generic"
match = '''java\.net\.BindException: Address already in use'''

# ── 启动就没起来 ──────────────────────────────────────────────────────────
#
# 这两条都发生在游戏跑起来之前：没有崩溃报告，栈也和游戏无关，用户看到的是
# 一闪而过的黑框。而它们恰恰是启动器自己的责任范围——classpath 是我们拼的，
# Java 是我们挑的。

# 同一个类在 classpath 上有两份，Fabric 开机第一件事就是查重然后拒绝启动。
# 版本描述里同时列了两代 ASM 就会这样：原版带一份，加载器要另一份，而合并成
# 一整份的版本文件里没人负责去重（见 fern_meta 的 effective_libraries）。
[[rule]]
id = "duplicate-asm-classes"
level = "exact"
scope = "console"
match = '''duplicate ASM classes found on classpath: \S*?/(?<first>[^/\s]+\.jar)![^,]*, \S*?/(?<second>[^/\s]+\.jar)!'''

# 只有启动器没有虚拟机的那份 Java。下载中途被打断就是这个样子：`bin/java` 在，
# `jvm.dll` 不在。报出来的一句话和「Java」两个字毫无关系，也不进崩溃报告。
[[rule]]
id = "java-without-a-jvm"
level = "named"
scope = "console"
match = '''Error: missing `(?:server|client)' JVM at `(?<path>[^'\n]+)'\.'''
