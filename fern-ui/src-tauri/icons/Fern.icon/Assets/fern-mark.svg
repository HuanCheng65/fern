<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7 9" width="140" height="180" shape-rendering="crispEdges" fill="currentColor">
  <!-- Fern mark · 直角螺线 2.5 圈 · 圈距 1 格 · 茎 2 格 -->
  <rect x="6" y="7" width="1" height="2"/><!-- 茎 -->
  <rect x="6" y="0" width="1" height="7"/><!-- 右侧上行 -->
  <rect x="0" y="0" width="6" height="1"/><!-- 顶部左行 -->
  <rect x="0" y="1" width="1" height="6"/><!-- 左侧下行 -->
  <rect x="1" y="6" width="4" height="1"/><!-- 底部右行 -->
  <rect x="4" y="2" width="1" height="4"/><!-- 内圈右侧 -->
  <rect x="2" y="2" width="2" height="1"/><!-- 内圈顶部 -->
  <rect x="2" y="3" width="1" height="2"/><!-- 内圈左侧 · 芽尖 -->
</svg>
