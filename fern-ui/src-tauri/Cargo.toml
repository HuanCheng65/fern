[package]
name = "fern-ui"
description = "Fern's Tauri application"
publish = false
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

# Keep the desktop app outside the root workspace so a core-only build does
# not require Linux WebView development libraries.
[workspace]

[lib]
name = "fern_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fern-core = { path = "../../fern-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
