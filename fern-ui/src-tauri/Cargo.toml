[package]
name = "fern-ui"
description = "Fern's Tauri application"
publish = false
version = "0.1.1-beta.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

# Keep the desktop app outside the root workspace so a core-only build does
# not require Linux WebView development libraries.
[workspace]

[lib]
name = "fern_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 只为了在 build.rs 里读 tauri.conf.json 的 version 做比对。tauri-build 本来就
# 依赖它，所以这一行不增加任何编译时间。
serde_json = "1.0.140"

[dependencies]
anyhow = "1.0.98"
fern-core = { path = "../../fern-core" }
pearl-core = { git = "https://github.com/HuanCheng65/pearl.git", rev = "15b47647b02f55bcd07365bf90a73256ea825e3a" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tauri = { version = "2", features = ["macos-private-api"] }
# 只用于选择已有的游戏目录。仅授予 dialog:allow-open。
tauri-plugin-dialog = "2"
# 一台机器上只跑一个 Fern。第二次双击时把已经开着的那个窗口叫到前面来。
# 没有前端包，也不暴露命令，所以不需要 capabilities 里的权限项。
tauri-plugin-single-instance = "2.4.3"
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
